<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Gunnar Tynes: Live</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Concerts on a world map, in the order they were played.">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--ground:#11141b;--plate:#1a1e28;--plate2:#242936;--rule:#ffffff1c;--paper:#ece8dc;--dim:#a3a6ad;--faint:#6f747f;
  --p:#e6b450;--r:#62b8ab;--m:#df8a74;--b:#9dabe6;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;--sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ground);color:var(--paper);font:14px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}a{color:inherit}
:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#map.over{cursor:pointer}#map.drag{cursor:grabbing}
#bar{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(#11141bf2 60%,#11141b00);z-index:3}
#bar h1{margin:0;font:400 20px/1 var(--serif);white-space:nowrap}
#views{display:flex;gap:14px}#right{margin-left:auto;display:flex;gap:16px;align-items:center}
.quiet{font-size:13px;color:var(--dim);padding:3px 2px;border-bottom:1px solid transparent;text-decoration:none;transition:color .15s}
.quiet:hover{color:var(--paper)}.quiet[aria-pressed=true],.quiet.on{color:var(--paper);border-color:var(--paper)}
#tag{font:11px var(--mono);color:var(--p)}
#foot{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(#11141b00,#11141be6 38%);z-index:2;pointer-events:none}
#speed{pointer-events:auto;display:flex;gap:1px;align-self:end;justify-self:end;font:12px var(--mono)}#speed button{padding:4px 7px;color:var(--faint);border-bottom:1px solid transparent}#speed button:hover{color:var(--paper)}#speed button[aria-pressed=true]{color:var(--paper);border-color:var(--paper)}
#now{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 14px;align-items:center;pointer-events:none;min-height:66px}
#play{pointer-events:auto;width:44px;height:44px;border-radius:50%;background:var(--paper);color:var(--ground);display:grid;place-items:center;box-shadow:0 2px 14px #000a;transition:transform .15s}
#play:hover{transform:scale(1.08)}#play svg{width:24px;height:24px;fill:currentColor;display:block}
#play .i-pause{display:none}#play.on .i-pause{display:block}#play.on .i-play{display:none}
#cap{min-width:0}#cap em{display:block;font:italic 400 23px/1.15 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cap b{font-weight:400;font-size:13px;color:var(--paper)}#cap span{font:12px var(--mono);color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#years{display:block;width:100%;height:46px;margin-top:6px;pointer-events:auto;touch-action:none;cursor:ew-resize}
#tip{position:fixed;pointer-events:none;background:var(--plate2);padding:6px 9px;font-size:13px;z-index:6;max-width:300px;border-radius:2px;display:none}
#tip em{font:italic 16px var(--serif);display:block}#tip span{font:11px var(--mono);color:var(--dim)}
#panel{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100%;background:var(--plate);z-index:5;transform:translateX(102%);transition:transform .26s cubic-bezier(.2,.7,.2,1);overflow:auto;padding:22px 24px 40px;box-shadow:-12px 0 40px #0006}
#panel.open{transform:none}
#close{position:absolute;top:14px;right:16px;font-size:22px;color:var(--dim);line-height:1;padding:6px}
#panel h2{font:italic 400 30px/1.1 var(--serif);margin:0 40px 2px 0}#panel .sub{font:12px var(--mono);color:var(--dim);margin-bottom:18px}
#panel ol{list-style:none;margin:0;padding:0}#panel li{padding:10px 0;border-top:1px solid var(--rule)}
#panel li time{font:12px var(--mono);color:var(--dim);display:block}#panel li strong{font-weight:500;display:block}
#panel li small{color:var(--dim);display:block;font-size:12px}#panel li .flag{color:var(--p)}#panel li .faint{color:var(--faint);font:11px var(--mono)}
#pop{position:fixed;z-index:4;background:var(--plate2);border-radius:2px;box-shadow:0 8px 30px #0008;min-width:230px;padding:4px}#pop button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:2px}#pop button:hover{background:#ffffff0d}#pop b{font-weight:500;font-size:13px;display:block}#pop small{color:var(--dim);font-size:11.5px;display:block}#pop button[aria-checked=true] b::after{content:" ✓";color:var(--p)}
#pins{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.pin{position:absolute;left:0;top:0;padding:0;width:var(--pw,170px);aspect-ratio:3/2;pointer-events:auto;cursor:zoom-in;background:var(--ground);border:3px solid var(--paper);border-radius:1px;box-shadow:0 8px 26px #000b;opacity:0;transition:opacity .9s;will-change:transform}.pin.on{opacity:1}.pin.on.old{opacity:0}.pin img{width:100%;height:100%;object-fit:cover;display:block}
#leg.caponly .frame{display:none}#leg.caponly.on .frame{pointer-events:none}
#hint{position:fixed;left:50%;top:calc(var(--bar,60px) + 8px);transform:translateX(-50%);font:12px var(--mono);color:var(--dim);opacity:0;transition:opacity .7s;pointer-events:none;z-index:2;white-space:nowrap;text-shadow:0 1px 6px #000}#hint.on{opacity:1}
#more{font:12px var(--mono);color:var(--dim);max-height:0;overflow:hidden;opacity:0;transition:opacity .8s,max-height .8s;white-space:nowrap;text-overflow:ellipsis}#more.on{opacity:1;max-height:1.6em}
#leg{position:fixed;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(var(--foot,120px) + 8px);width:min(34vw,420px);z-index:2;opacity:0;transition:opacity .9s;pointer-events:none}#leg.on{opacity:1}
#leg .frame{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;background:#0b0d12;cursor:zoom-in;display:block;padding:0;border-radius:1px;box-shadow:0 10px 40px #000a}#leg.on .frame{pointer-events:auto}
#leg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease}#leg img.show{opacity:.94}
#legCap{font:11px var(--mono);color:var(--dim);margin-top:6px;min-height:1.4em;text-align:right;text-shadow:0 1px 6px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.years{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 14px}.years button{font:13px var(--mono);padding:4px 8px;border:1px solid var(--rule);border-radius:2px;color:var(--dim);position:relative}.years button:hover{border-color:#ffffff50;color:var(--paper)}.years button[aria-pressed=true]{background:var(--plate2);color:var(--paper);border-color:#ffffff40}.years sup{font-size:9px;color:var(--faint);margin-left:2px;vertical-align:4px;line-height:0}.years .ph::after{content:"";position:absolute;right:3px;top:3px;width:4px;height:4px;border-radius:50%;background:var(--p)}
.ask{font:italic 20px var(--serif);color:var(--dim);margin:6px 0 0}
.fromHere{font:12px var(--mono);color:var(--paper);border:1px solid #ffffff40;border-radius:2px;padding:3px 8px;margin-top:6px}.fromHere:hover{border-color:var(--paper)}
#panel li .run{color:var(--dim);font-size:12px;display:block;margin-top:2px}
#cam{pointer-events:auto;display:inline-block;margin-left:10px;font:12px var(--mono);color:var(--paper);border:1px solid #ffffff40;border-radius:2px;padding:1px 7px;vertical-align:1px;background:#11141bcc}
#cam:hover{border-color:var(--paper)}
.thumbs{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0 3px}.thumbs button{position:relative;width:62px;height:46px;overflow:hidden;background:var(--plate2);border-radius:1px}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}.thumbs .more{position:absolute;inset:0;background:#11141bb0;display:grid;place-items:center;font:12px var(--mono)}
#view{position:fixed;inset:0;background:#0b0d12f7;z-index:8;display:grid;grid-template-rows:1fr auto;touch-action:pan-y}
#view figure{margin:0;min-height:0;display:grid;place-items:center;padding:16px 16px 6px}#view img{max-width:100%;max-height:100%;object-fit:contain;display:block}
#view .meta{padding:6px 18px max(16px,env(safe-area-inset-bottom,0px));text-align:center}#view em{font:italic 20px/1.25 var(--serif);display:block}#view small{font:12px var(--mono);color:var(--dim);display:block;margin-top:3px}#view small a{color:var(--dim)}
#view .nav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:70px;font-size:30px;color:var(--paper);opacity:.8}#view .nav:hover{opacity:1}#vPrev{left:4px}#vNext{right:4px}
#vClose{position:absolute;top:10px;right:14px;font-size:26px;color:var(--paper);padding:6px 10px;z-index:1}
@media(max-width:700px){
  #now{grid-template-columns:44px minmax(0,1fr)}#speed{grid-column:2;justify-self:start;margin-left:-7px}
  #leg{left:16px;right:16px;width:auto}#leg .frame{aspect-ratio:16/10;max-height:30vh}#legCap{text-align:left}
  #view .nav{width:40px}#view em{font-size:17px}
  #panel{top:auto;left:0;right:0;width:auto;height:58%;transform:translateY(102%);box-shadow:0 -12px 40px #0006}
  #bar{gap:6px 14px;padding-bottom:6px}#right{gap:12px}.pin{--pw:112px}#tag{display:none}
  #cap em{font-size:19px}#now{min-height:58px}#years{height:40px}
}
</style></head><body>
<canvas id="map" aria-label="World map of concerts"></canvas>
<header id="bar">
  <h1>gunnar tynes</h1>
  <nav id="views" aria-label="View">
    <a class="quiet" href="../?view=timeline&amp;layout=horizontal">Timeline</a>
    <a class="quiet" href="../?view=timeline&amp;layout=vertical">Vertical</a>
    <a class="quiet" href="../?view=record">Record</a>
    <span class="quiet on" aria-current="page">Live</span>
  </nav>
  <span id="tag" hidden>draft list, not published</span>
  <div id="right">
    <a class="quiet" href="https://gunnartynes.com/">Main site</a>
    <button class="quiet" id="viewBtn" aria-haspopup="menu" aria-expanded="false" title="How the camera moves during play">View</button>
    <button class="quiet" id="photoBtn" aria-haspopup="menu" aria-expanded="false" title="Show photos during play">Photos</button>
    <button class="quiet" id="fit" title="Show the whole world">World</button>
    <button class="quiet" id="doubt" hidden aria-pressed="false" title="Include entries marked doubtful">Doubtful</button>
  </div>
</header>
<footer id="foot">
  <div id="now">
    <button id="play" type="button" aria-label="Play the tours"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19 12z"/></svg><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg></button>
    <div id="cap" aria-live="off"><em></em><b></b><span></span><div id="more"></div></div>
    <div id="speed" role="group" aria-label="Speed"><button type="button" data-speed="slow" title="Slow, with photos and more about each show">Slow</button><button type="button" data-speed=".5">½×</button><button type="button" data-speed="1">1×</button><button type="button" data-speed="2">2×</button><button type="button" data-speed="4">4×</button></div>
  </div>
  <canvas id="years" aria-label="Scrub through the years"></canvas>
</footer>
<div id="tip"></div>
<div id="pins" aria-hidden="false"></div>
<div id="pop" role="menu" hidden></div>
<div id="hint" aria-live="polite"></div>
<div id="leg" aria-hidden="true"><button class="frame" type="button" id="legFrame" aria-label="Open this photo"><img alt=""><img alt=""></button><div id="legCap"></div></div>
<div id="view" hidden role="dialog" aria-label="Photos"><button id="vClose" aria-label="Close photos">×</button><figure><img id="vImg" alt=""></figure><button class="nav" id="vPrev" aria-label="Previous photo">‹</button><button class="nav" id="vNext" aria-label="Next photo">›</button><div class="meta"><em id="vCap"></em><small id="vBy"></small></div></div>
<aside id="panel" aria-label="Shows in this city"><button id="close" aria-label="Close">×</button><div id="pBody"></div></aside>
<script src="map.js"></script>
<script src="shows.js"></script>
<script src="../catalogue.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL={paper:css('--paper'),dim:css('--dim'),faint:css('--faint'),tour:[css('--p'),css('--r'),css('--m'),css('--b')]};
const STRETCH=1.22,SHOW_SECONDS=.62,SLOW_RATE=.16,PHOTO_SECONDS=4.2,TOUR_GAP=21,REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const px=lon=>lon,py=lat=>-lat*STRETCH;
const cv=$('#map'),g=cv.getContext('2d'),yc=$('#years'),yg=yc.getContext('2d');
/* Music is off for now. The code stays, ready for when audio is worked on: set soundOn to true and bring back a Sound button. */
let W=0,H=0,DPR=1,dirty=true,showDoubt=false,soundOn=false;
const LIVE={shows:SHOWS.shows,land:LIVEMAP.land,outline:LIVEMAP.coast};
if(SHOWS.draft){$('#tag').hidden=false;$('#doubt').hidden=false}
const LAND=[];for(const[lat,row]of LIVE.land)for(const lon of row)LAND.push(px(lon),py(lat));
const COAST=new Path2D();for(const ring of LIVE.outline){ring.forEach((q,i)=>{if(!i||Math.abs(q[0]-ring[i-1][0])>180)COAST.moveTo(px(q[0]),py(q[1]));else COAST.lineTo(px(q[0]),py(q[1]))});COAST.closePath()}

const photosOf=s=>s.photos||[];
/* ---------- data: shows in order, grouped into tours by the gaps between them ---------- */
let S=[],CITIES=[],TOURS=[];
const day=s=>Date.parse(s+'T00:00:00Z')/864e5;
const fmt=(s,e)=>{const f=x=>new Date(x+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});return e?f(s)+' – '+f(e):f(s)};
function build(){
  S=LIVE.shows.filter(s=>showDoubt||s.s!=='doubtful').slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  const map=new Map();TOURS=[];
  S.forEach((s,i)=>{
    s.i=i;s.x=px(s.lon);s.y=py(s.lat);s.t=day(s.d);
    if(!i||s.t-S[i-1].t>TOUR_GAP)TOURS.push({a:i,b:i,col:COL.tour[TOURS.length%4]});
    const T=TOURS[TOURS.length-1];T.b=i;s.tour=TOURS.length-1;
    const key=s.c+'|'+s.k;let c=map.get(key);if(!c){c={key,name:s.c,k:s.k,x:s.x,y:s.y,shows:[],first:i};map.set(key,c)}
    c.shows.push(s);s.city=c;if(photosOf(s).length)c.hasPhotos=true;
  });
  CITIES=[...map.values()];
  TOURS.forEach(T=>{let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(let i=T.a;i<=T.b;i++){const s=S[i];x0=Math.min(x0,s.x);x1=Math.max(x1,s.x);y0=Math.min(y0,s.y);y1=Math.max(y1,s.y)}T.box=[x0,x1,y0,y1]});
}
build();

/* ---------- photos ---------- */
const V={list:[],i:0,x:null};
function viewShow(){
  const p=V.list[V.i];if(!p)return;const img=$('#vImg');img.src=p.src;img.alt=p.cap||'';
  $('#vCap').textContent=p.cap||'';
  $('#vBy').innerHTML=[p.show?esc(p.show):'',p.by?'Photo: '+esc(p.by):'',p.lic?(p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.lic)}</a>`:esc(p.lic)):'',V.list.length>1?`${V.i+1} of ${V.list.length}`:''].filter(Boolean).join(' · ');
  $('#vPrev').hidden=$('#vNext').hidden=V.list.length<2;
  const nx=V.list[(V.i+1)%V.list.length];if(nx){const pre=new Image();pre.src=nx.src}
}
function openPhotos(s,i=0){V.resume=P.playing?{slow:P.slow}:null;if(P.playing)play(false);V.list=photosOf(s).map(p=>({...p,show:`${fmt(s.d)}, ${s.c}`}));V.i=i;$('#view').hidden=false;$('#tip').style.display='none';viewShow();$('#vClose').focus()}
function closePhotos(){$('#view').hidden=true;$('#vImg').removeAttribute('src');if(V.resume){const r=V.resume;V.resume=null;play(true);if(r.slow)setSlow(true)}}
function stepPhoto(d){V.i=(V.i+d+V.list.length)%V.list.length;viewShow()}

/* ---------- camera ---------- */
const cam={x:0,y:-40,z:3,tx:0,ty:-40,tz:3,manual:false};
function chrome(){return{top:$('#bar').offsetHeight,bot:$('#foot').offsetHeight}}
function fitBox(x0,x1,y0,y1,pad){
  const{top,bot}=chrome(),w=Math.max(8,x1-x0),h=Math.max(5,y1-y0);
  const panelOpen=$('#panel').classList.contains('open');
  const legOn=$('#leg').classList.contains('on')&&!$('#leg').classList.contains('caponly');
  const pw=panelOpen&&W>700?400:(legOn&&W>700?Math.min(W*.34,420)+30:0);
  const extra=legOn&&W<=700?$('#leg').offsetHeight+10:0;
  /* Max guards a window that has no size yet, such as a background tab: a zero or negative zoom would blank the map for good. */
  const z=clamp(Math.min((W-pw-pad*2)/w,(H-top-bot-extra-pad*2)/h),Math.max(.3,Math.min(W/345,(H-top-bot)/150)),W>700?26:18);
  const off=(top-bot-extra)/2/z;
  cam.tx=(x0+x1)/2+pw/2/z;cam.ty=(y0+y1)/2-off;cam.tz=z;
}
function fitWorld(){cam.manual=false;fitBox(-128,152,py(66),py(-40),W>700?26:8);dirty=true}
function aimAhead(n){
  if(cam.manual)return;
  const a=Math.max(0,n-(P.slow?1:2)),b=Math.min(LAST(),n+(P.slow?3:7));let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const ref=S[n].x;
  for(let i=a;i<=b;i++){const s=S[i];if(s.tour!==S[n].tour)continue;let x=s.x;if(x-ref>180)x-=360;else if(ref-x>180)x+=360;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,s.y);y1=Math.max(y1,s.y)}
  const pad=W>700?110:44,cw=(x0+x1)/2,ch=(y0+y1)/2,minW=W>700?40:24;
  fitBox(cw-Math.max(x1-x0,minW)/2,cw+Math.max(x1-x0,minW)/2,ch-Math.max(y1-y0,9)/2,ch+Math.max(y1-y0,9)/2,pad);
}
const SX=x=>(x-cam.x)*cam.z+W/2,SY=y=>(y-cam.y)*cam.z+H/2;

/* ---------- playback ---------- */
const P={pos:0,playing:false,pulse:-1,pulseT:0,slow:false,rate:1,hi:-1,speed:1,view:'follow',photos:'off'};
try{const v=localStorage.getItem('gt.live.view');if(['follow','overview','free'].includes(v))P.view=v;const f=localStorage.getItem('gt.live.photos');if(['off','map','side','behind'].includes(f))P.photos=f}catch(e){}
try{const v=parseFloat(localStorage.getItem('gt.live.speed'));if([.5,1,2,4].includes(v)){P.speed=v;P.rate=v}}catch(e){}   /* pos: shows reached, with the fraction of the leg under way */
const LAST=()=>S.length-1;
P.pos=LAST();
function legFrom(i){return i>=0&&i+1<S.length&&S[i+1].tour===S[i].tour}
function setPos(v,fromUser){
  const before=Math.floor(P.pos);
  P.pos=clamp(v,0,LAST());
  const now=Math.floor(P.pos);
  if(now!==before){if(now>before||fromUser){P.pulse=now;P.pulseT=performance.now()}showCaption();aim();if(P.playing)songFor(S[now])}
  dirty=true;
}
function aim(){const n=Math.floor(P.pos);if(S[n]&&!atEnd()&&P.view==='overview')aimAhead(n)}
/* Follow: the view stays on the moving dot, at whatever zoom the visitor has set. */
const defaultZoom=()=>clamp(W/95,7,16);
function viewOffset(z){
  const{top,bot}=chrome(),panel=$('#panel').classList.contains('open'),legOn=$('#leg').classList.contains('on')&&!$('#leg').classList.contains('caponly');
  const pw=panel&&W>700?400:(legOn&&W>700?Math.min(W*.34,420)+30:0),extra=legOn&&W<=700?$('#leg').offsetHeight+10:0;
  return{x:pw/2/z,y:-(top-bot-extra)/2/z};
}
function headPoint(){
  const n=Math.floor(P.pos),f=P.pos-n,a=S[n];if(!a)return{x:cam.x,y:cam.y};if(!legFrom(n)||f<=0)return a;
  const b=legPaths(a,S[n+1])[0][1],c=curve(a,b),q=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
  return{x:(1-q)*(1-q)*a.x+2*(1-q)*q*c.cx+q*q*b.x,y:(1-q)*(1-q)*a.y+2*(1-q)*q*c.cy+q*q*b.y};
}
function followCam(){
  if(P.view!=='follow'||cam.manual||atEnd())return;

/* ---------- slowing time: a click while playing, and again to speed back up ---------- */

/* Photos during play. Off by default; Slow always brings up the side photo, as it is the point of slowing down. */

const Leg={list:[],i:0,t:0,key:null,side:0,cur:null};

/* This stretch of the road: this show's photos first, then the nearest shows on the same run. */

/* ---------- sound: múm's release of the period, from the catalogue ---------- */
const music=(window.CATALOGUE||[]).filter(e=>/múm/.test(e.artist)&&e.tier==='core'&&!e.screen&&(e.tracks||[]).some(t=>t.p)).sort((a,b)=>a.year-b.year);
const au={el:null,key:null};

function yearX(t){const a=day(S[0].d.slice(0,4)+'-01-01'),b=day('2027-01-01');return 8+(t-a)/(b-a)*(yc.clientWidth-16)}

/* ---------- the frame ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(P.playing){
    const n=Math.floor(P.pos);
    /* within a tour it travels at show speed; between tours it holds a moment while the camera moves */
    P.rate+=((P.slow?SLOW_RATE:P.speed)-P.rate)*(1-Math.exp(-dt/.45));
    const speed=(legFrom(n)?1/SHOW_SECONDS:1/(SHOW_SECONDS*1.9))*P.rate;
    tickLeg(dt);
    if(P.pos>=LAST()){play(false);P.armed=false;syncSpeed();clearPins();Back.cur=Back.prev=null;$('#leg').classList.remove('on','caponly');P.scrubbed=false;cam.manual=false;fitWorld();showCaption()}
    else setPos(P.pos+dt*speed);
    dirty=true;
  }
  followCam();
  const k=1-Math.exp(-dt/(P.view==='follow'&&!cam.manual&&!atEnd()?(P.slow?.45:clamp(.2/P.rate,.08,.4)):(P.slow?1.1:(P.playing?.55:.28))));
  if(Math.abs(cam.x-cam.tx)>.002||Math.abs(cam.y-cam.ty)>.002||Math.abs(cam.z-cam.tz)>.001){
    const lz=Math.log(cam.z)+(Math.log(cam.tz)-Math.log(cam.z))*k;cam.z=Math.exp(lz);cam.x+=(cam.tx-cam.x)*k;cam.y+=(cam.ty-cam.y)*k;dirty=true;
  }
  if(dirty){dirty=false;drawMap(now);drawYears()}
  requestAnimationFrame(frame);
}

/* ---------- pointer: pan, zoom, hover, tap ---------- */
let hoverCity=null,selCity=null,pts=new Map(),moved=0,pinch=0,dragLast=null;

  if(pts.size===2){const[a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,d/pinch);pinch=d;moved=99;return}
  if(pts.size===1&&dragLast){const dx=ev.clientX-dragLast[0],dy=ev.clientY-dragLast[1];moved+=Math.abs(dx)+Math.abs(dy);dragLast=[ev.clientX,ev.clientY];if(moved>6){if(!cam.manual&&P.view==='follow'&&P.playing)flashHint('Stopped following. View › Follow to rejoin',3200);cam.manual=true;cam.tx-=dx/cam.z;cam.ty-=dy/cam.z;cam.x=cam.tx;cam.y=cam.ty;dirty=true}return}
  if(ev.pointerType!=='mouse')return;
  const h=P.playing?null:hit(ev.clientX,ev.clientY);
  if(h!==hoverCity){hoverCity=h;cv.classList.toggle('over',!!h);dirty=true}
  const tip=$('#tip');
  if(h){tip.style.display='block';tip.innerHTML=`<em>${esc(h.name)}</em><span>${h.shows.length} ${h.shows.length===1?'show':'shows'}</span>`;tip.style.left=Math.min(W-180,ev.clientX+14)+'px';tip.style.top=Math.max(50,ev.clientY-46)+'px'}else tip.style.display='none';
});
cv.addEventListener('pointerup',ev=>{pts.delete(ev.pointerId);pinch=0;cv.classList.remove('drag');if(moved<6&&pts.size===0){if(P.playing){setSlow(!P.slow);P.armed=P.slow}else{const h=hit(ev.clientX,ev.clientY);if(h)openCity(h);else if(selCity)closeCity()}}dragLast=null});
cv.addEventListener('pointercancel',ev=>{pts.delete(ev.pointerId);cv.classList.remove('drag');dragLast=null});
cv.addEventListener('pointerleave',()=>{if(hoverCity){hoverCity=null;dirty=true}$('#tip').style.display='none'});
function zoomAt(mx,my,f){
  const zmin=Math.min(W/345,1.2);
  if(P.view==='follow'&&!cam.manual&&!atEnd()){cam.userZ=clamp(cam.tz*f,zmin,60);cam.tz=cam.userZ;dirty=true;return}
  cam.manual=true;const nz=clamp(cam.tz*f,zmin,60);cam.userZ=nz;constwx=(mx-W/2)/cam.tz+cam.tx,wy=(my-H/2)/cam.tz+cam.ty;cam.tz=nz;cam.tx=wx-(mx-W/2)/nz;cam.ty=wy-(my-H/2)/nz;dirty=true}
cv.addEventListener('wheel',ev=>{ev.preventDefault();zoomAt(ev.clientX,ev.clientY,Math.exp(-ev.deltaY*.0016))},{passive:false});

/* the years strip */
function scrub(ev){const r=yc.getBoundingClientRect(),x=ev.clientX-r.left;let best=0,bd=1e9;for(const s of S){const d=Math.abs(yearX(s.t)-x);if(d<bd){bd=d;best=s.i}}P.scrubbed=true;cam.manual=P.view==='free';const was=Math.floor(P.pos);if(best===was){showCaption();aim()}else setPos(best,true);dirty=true}
yc.addEventListener('pointerdown',ev=>{yc.setPointerCapture(ev.pointerId);yc._on=true;scrub(ev)});
yc.addEventListener('pointermove',ev=>{if(yc._on)scrub(ev)});
yc.addEventListener('pointerup',()=>yc._on=false);yc.addEventListener('pointercancel',()=>yc._on=false);

/* a city's shows */
let selYear=null;
function openCity(c,year){
  selCity=c;$('#tip').style.display='none';
  const years=[...new Set(c.shows.map(s=>s.d.slice(0,4)))].sort();
  selYear=year||(years.length===1?years[0]:null);
  const first=years[0],last=years[years.length-1];
  const chip=y=>{const list=c.shows.filter(s=>s.d.startsWith(y)),ph=list.some(s=>photosOf(s).length);return `<button type="button" data-year="${y}" aria-pressed="${selYear===y}" class="${ph?'ph':''}" ${ph?'title="Has photos"':''}>${y}${list.length>1?`<sup>${list.length}</sup>`:''}</button>`};
  const shows=selYear?c.shows.filter(s=>s.d.startsWith(selYear)):[];
  const rows=shows.map(s=>{
    const T=TOURS[s.tour],n=T.b-T.a+1,ph=photosOf(s),few=ph.slice(0,5);
    return `<li><time>${esc(fmt(s.d,s.e))}</time><strong>${esc(s.v&&!/unknown/i.test(s.v)?s.v:(s.n||'Venue not known'))}</strong>${s.n&&s.v&&s.n!==s.v?`<small>${esc(s.n)}</small>`:''}${s.w?`<small>with ${esc(s.w)}</small>`:''}${s.absent?'<small>Without Gunnar</small>':''}${s.note?`<small>${esc(s.note)}</small>`:''}${n>1?`<span class="run">Show ${s.i-T.a+1} of ${n} on a run from ${esc(fmt(S[T.a].d))} to ${esc(fmt(S[T.b].d))}</span>`:''}${few.length?`<div class="thumbs">${few.map((p,i)=>`<button type="button" data-show="${s.i}" data-ph="${i}" aria-label="Open photo ${i+1} of ${ph.length}"><img loading="lazy" src="${esc(p.src)}" alt="">${i===4&&ph.length>5?`<span class="more">+${ph.length-4}</span>`:''}</button>`).join('')}</div>`:''}<small class="faint">${esc(s.src)}${s.ca?` · <a href="${esc(s.ca)}" target="_blank" rel="noopener">listing</a>`:''}${(s.press||[]).map((u,i)=>` · <a href="${esc(u)}" target="_blank" rel="noopener">newspaper ${i+1}</a>`).join('')}</small><button type="button" class="fromHere" data-from="${s.i}">Play from here</button></li>`;
  }).join('');
  $('#pBody').innerHTML=`<h2>${esc(c.name)}</h2><div class="sub">${esc(c.k)} · ${c.shows.length} ${c.shows.length===1?'show':'shows'}${years.length>1?`, ${first}–${last}`:`, ${first}`}</div>${years.length>1?`<div class="years">${years.map(chip).join('')}</div>`:''}${selYear?`<ol>${rows}</ol>`:'<p class="ask">Which year?</p>'}`;
  /* the run behind the chosen year lights up on the map */
  P.hi=shows.length?shows[0].tour:-1;
  $('#panel').classList.add('open');$('#panel').scrollTop=0;dirty=true;
}
function closeCity(){selCity=null;selYear=null;P.hi=-1;$('#panel').classList.remove('open');dirty=true}
const MENUS={
  viewBtn:{key:'view',store:'gt.live.view',items:[['follow','Follow','The camera stays on the dot, at your zoom'],['overview','Overview','Frames the next few stops'],['free','Free','Stays where you put it']]},
  photoBtn:{key:'photos',store:'gt.live.photos',items:[['off','Off','Photos only when you slow down'],['map','On the map','Small prints pinned to their cities'],['side','Beside the map','One photo at a time at the side'],['behind','Behind the map','A faint photo behind the road']]}
};
function closeMenu(){$('#pop').hidden=true;['viewBtn','photoBtn'].forEach(i=>$('#'+i).setAttribute('aria-expanded',false))}
function openMenu(id){
  const m=MENUS[id],btn=$('#'+id),pop=$('#pop'),was=!pop.hidden&&pop.dataset.for===id;closeMenu();if(was)return;
  pop.dataset.for=id;pop.innerHTML=m.items.map(([v,l,d])=>`<button type="button" role="menuitemradio" aria-checked="${P[m.key]===v&&!(m.key==='view'&&cam.manual&&v==='follow')}" data-v="${v}"><b>${l}</b><small>${d}</small></button>`).join('');
  pop.hidden=false;btn.setAttribute('aria-expanded',true);
  const r=btn.getBoundingClientRect(),w=pop.offsetWidth;pop.style.left=clamp(r.right-w,8,W-w-8)+'px';pop.style.top=(r.bottom+6)+'px';
}
Object.keys(MENUS).forEach(id=>{$('#'+id).onclick=ev=>{ev.stopPropagation();openMenu(id)}});
$('#pop').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-v]');if(!b)return;const m=MENUS[$('#pop').dataset.for],v=b.dataset.v;
  P[m.key]=v;try{localStorage.setItem(m.store,v)}catch(e){}
  if(m.key==='view'){cam.manual=v==='free';if(cam.manual){cam.tx=cam.x;cam.ty=cam.y;cam.tz=cam.z}else if(!atEnd())aim()}else restartPhotos();
  syncMenus();closeMenu();dirty=true;
});
addEventListener('pointerdown',ev=>{if(!$('#pop').hidden&&!ev.target.closest('#pop,#viewBtn,#photoBtn'))closeMenu()});
function syncMenus(){$('#photoBtn').classList.toggle('on',P.photos!=='off')}
$('#close').onclick=closeCity;
$('#speed').addEventListener('click',ev=>{const b=ev.target.closest('[data-speed]');if(!b)return;if(b.dataset.speed==='slow'&&!P.playing){P.armed=!P.armed;b.setAttribute('aria-pressed',P.armed);if(P.armed)document.querySelectorAll('#speed button:not([data-speed=slow])').forEach(x=>x.setAttribute('aria-pressed',false));else syncSpeed();return}setSpeed(b.dataset.speed)});
if(window.ResizeObserver)new ResizeObserver(()=>{syncChrome();dirty=true}).observe($('#foot'));
$('#pBody').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-ph]');if(b){openPhotos(S[+b.dataset.show],+b.dataset.ph);return}
  const y=ev.target.closest('[data-year]');if(y){openCity(selCity,y.dataset.year);return}
  const f=ev.target.closest('[data-from]');if(f){const i=+f.dataset.from;closeCity();P.scrubbed=true;cam.manual=false;P.pos=i;showCaption();play(true);return}
});
$('#legFrame').onclick=()=>{const p=Leg.cur;if(!p)return;openPhotos(p.show,p.idx)};
$('#vClose').onclick=closePhotos;$('#vPrev').onclick=()=>stepPhoto(-1);$('#vNext').onclick=()=>stepPhoto(1);
$('#view').addEventListener('click',ev=>{if(ev.target.id==='view'||ev.target.tagName==='FIGURE')closePhotos()});
$('#view').addEventListener('pointerdown',ev=>{V.x=ev.clientX});$('#view').addEventListener('pointerup',ev=>{if(V.x!=null&&Math.abs(ev.clientX-V.x)>50&&V.list.length>1)stepPhoto(ev.clientX<V.x?1:-1);V.x=null});
$('#play').onclick=()=>play(!P.playing);
$('#fit').onclick=()=>{cam.manual=true;cam.userZ=null;fitBox(-128,152,py(66),py(-40),W>700?26:8);dirty=true};
$('#doubt').onclick=ev=>{showDoubt=!showDoubt;ev.currentTarget.setAttribute('aria-pressed',showDoubt);play(false);closeCity();build();P.pos=LAST();P.scrubbed=false;CITIES.forEach(c=>c.sx=null);fitWorld();showCaption();dirty=true};
addEventListener('keydown',ev=>{if(!$('#view').hidden){if(ev.key==='Escape')closePhotos();else if(ev.key==='ArrowRight')stepPhoto(1);else if(ev.key==='ArrowLeft')stepPhoto(-1);return}if(ev.key===' '&&ev.target.tagName!=='BUTTON'){ev.preventDefault();play(!P.playing)}else if(ev.key==='Escape')closeCity();else if((ev.key==='s'||ev.key==='S')&&P.playing){setSlow(!P.slow);P.armed=P.slow}else if((ev.key==='+'||ev.key==='=')||ev.key==='-'){const L=[.5,1,2,4],i=L.indexOf(P.speed)+(ev.key==='-'?-1:1);if(L[i])setSpeed(L[i])}else if(ev.key==='ArrowRight'){P.scrubbed=true;setPos(Math.floor(P.pos)+1,true)}else if(ev.key==='ArrowLeft'){P.scrubbed=true;setPos(Math.floor(P.pos)-1,true)}});
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;if(atEnd()&&!cam.manual&&!P.scrubbed){fitWorld();cam.x=cam.tx;cam.y=cam.ty;cam.z=cam.tz}else aim();if(!(cam.z>0)){cam.z=cam.tz>0?cam.tz:1;cam.x=cam.tx;cam.y=cam.ty}dirty=true}
addEventListener('resize',()=>{resize();syncChrome()});
window.__live={Pins,Back,headPoint,photoMode,setSpeed,setSlow,Leg,openPhotos,photosOf,P,cam,S:()=>S,CITIES:()=>CITIES,TOURS:()=>TOURS,au,play,setPos,openCity,SX,SY};
syncMenus();syncSpeed();syncChrome();resize();fitWorld();cam.x=cam.tx;cam.y=cam.ty;cam.z=cam.tz;showCaption();
if(document.fonts)document.fonts.ready.then(()=>dirty=true);
requestAnimationFrame(frame);
</script>
