<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gunnar Tynes</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--ground:#0b0d12;--paper:#ece8dc;--dim:#a3a6ad;--faint:#6f747f;--amber:#e6b450;--rule:#ffffff1a;
  --serif:"Newsreader",Georgia,serif;--sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--paper);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
.lab{position:fixed;top:max(16px,env(safe-area-inset-top));left:16px;font:11px var(--mono);letter-spacing:.14em;color:var(--faint);text-transform:uppercase;z-index:2}
header{position:fixed;left:0;right:0;top:max(38px,calc(env(safe-area-inset-top) + 28px));text-align:center;pointer-events:none;z-index:2;padding:0 16px}
h1{margin:0;font:400 clamp(30px,4.6vw,50px)/1 var(--serif)}
header p{margin:10px auto 0;max-width:520px;font-size:13.5px;line-height:1.5;color:var(--dim)}
.cap{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;padding:0 16px;z-index:2;pointer-events:none}
.now{min-height:50px}.now .y{font:13px var(--mono);letter-spacing:.2em;color:var(--amber)}.now em{display:block;font:italic 400 19px/1.25 var(--serif)}.now b{font:400 12.5px var(--sans);color:var(--dim)}
nav{display:flex;justify-content:center;gap:28px;margin-top:8px;pointer-events:auto}
nav a{color:var(--paper);text-decoration:none;font:italic 400 22px var(--serif);border-bottom:1px solid transparent}
nav a:hover{border-color:var(--paper)}
nav a.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:9px;vertical-align:3px}
</style></head><body>
<canvas id="c"></canvas>
<div class="lab">Prototype · the sound of each year</div>
<header><h1>gunnar tynes</h1><p>Every line is a year. Its shape is the sound of that year's music: low notes on the left, high on the right. Click a line to hear it.</p></header>
<div class="cap"><div class="now" id="now"></div>
  <nav><a href="/?view=timeline">Timeline</a><a href="/?view=record">Record</a><a class="live" href="/live/">Live</a></nav></div>
<script src="data.js"></script>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const D=window.RIDGES,Y=D.years,NB=Y[0].s.length,edges=D.bands;
/* clean the curves: fill bands too narrow to hold a measurement, then show how each year differs from the career's average sound */
Y.forEach(y=>{if(!y.r.length)return;const s=y.s;const ok=s.map(v=>v>.03);
  for(let j=0;j<NB;j++)if(!ok[j]){let a=j-1,b=j+1;while(a>=0&&!ok[a])a--;while(b<NB&&!ok[b])b++;const va=a>=0?s[a]:s[b],vb=b<NB?s[b]:va;s[j]=a<0||b>=NB?(a<0?vb:va):va+(vb-va)*(j-a)/(b-a)}
  for(let j=0;j<NB;j++)if(ok[j]&&j>0&&j<NB-1&&Math.abs(s[j]-(s[j-1]+s[j+1])/2)>.25)s[j]=(s[j-1]+s[j+1])/2});
const MEAN=new Array(NB).fill(0);let nY=0;Y.forEach(y=>{if(!y.r.length)return;nY++;y.s.forEach((v,j)=>MEAN[j]+=v)});MEAN.forEach((v,j)=>MEAN[j]=v/nY);
Y.forEach(y=>{y.v=y.s.map((v,j)=>y.r.length?Math.max(0,MEAN[j]*.45+(v-MEAN[j])*2.6+.06):0)});
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let W,H,DPR,L,T0,WD,GAP,AMP;
function size(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  const top=W<700?230:215,bot=W<700?150:130;GAP=(H-top-bot)/(Y.length-1);AMP=GAP*(W<700?5:6.2);
  WD=Math.min(W*(W<700?.8:.5),620);L=(W-WD)/2;T0=top+AMP*.15}
size();addEventListener('resize',size);
const live=new Float32Array(NB),liveA={v:0};
let hoverY=-1,playY=-1,pick=0,audio=null,ctx=null,an=null,fbuf=null;
/* the curve, tapered at both ends so each ridge rises from a flat line, like a pulsar plot */
function shape(j){const u=j/(NB-1);return Math.pow(Math.sin(Math.PI*Math.min(1,Math.max(0,(u-.04)/.92))),.9)}
function play(i){
  const yr=Y[i];if(!yr.r.length)return;
  if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();an=ctx.createAnalyser();an.fftSize=4096;an.smoothingTimeConstant=.75;fbuf=new Float32Array(an.frequencyBinCount);an.connect(ctx.destination)}
  ctx.resume();
  if(playY===i&&audio&&!audio.paused){audio.pause();playY=-1;caption(i);return}
  if(playY===i)pick=(pick+1)%yr.r.length;else pick=0;
  const r=yr.r[pick];
  if(audio){audio.pause()}
  audio=new Audio();audio.crossOrigin='anonymous';audio.src=r.p;const src=ctx.createMediaElementSource(audio);src.connect(an);
  audio.play().catch(()=>{});playY=i;caption(i);
  audio.onended=()=>{if(playY===i){playY=-1;caption(i)}};
}
function caption(i){
  const n=document.getElementById('now');if(i<0){n.innerHTML='';return}
  const yr=Y[i],r=yr.r[playY===i?pick:0];
  n.innerHTML=`<div class="y">${yr.y}${yr.r.length?` · ${yr.r.length} ${yr.r.length>1?'releases':'release'}`:' · nothing released'}</div>`+(r?`<em>${playY===i?'Playing ':''}${esc(r.k||r.t)}</em><b>${esc(r.a)} · ${esc(r.t)}${playY===i&&yr.r.length>1?' · click again for the next':''}</b>`:'');
}
function readLive(){
  if(!an||playY<0)return;an.getFloatFrequencyData(fbuf);const sr=ctx.sampleRate,bw=sr/an.fftSize;
  for(let j=0;j<NB;j++){const a=Math.floor(edges[j]/bw),b=Math.max(a+1,Math.floor(edges[j+1]/bw));let m=-140;for(let k=a;k<b&&k<fbuf.length;k++)m=Math.max(m,fbuf[k]);
    const v=Math.min(1,Math.max(0,(m+95)/70));live[j]+=(v-live[j])*.35}
}
function frame(now){
  const t=now/1000;readLive();liveA.v+=((playY>=0&&audio&&!audio.paused?1:0)-liveA.v)*.06;
  g.setTransform(DPR,0,0,DPR,0,0);g.fillStyle='#0b0d12';g.fillRect(0,0,W,H);
  for(let i=0;i<Y.length;i++){
    const yr=Y[i],base=T0+i*GAP,act=i===playY,hov=i===hoverY;
    const breath=REDUCED?1:1+.035*Math.sin(t*.9+i*.7);
    g.beginPath();g.moveTo(L-30,base);
    for(let j=0;j<NB;j++){
      let v=yr.v[j];if(act)v=v*(1-liveA.v)+Math.pow(live[j],1.4)*liveA.v*.9;
      const x=L+j/(NB-1)*WD,y=base-v*shape(j)*AMP*breath;
      g.lineTo(x,y);
    }
    g.lineTo(L+WD+30,base);
    /* each ridge hides what lies behind it */
    const ridge=new Path2D();ridge.addPath(new Path2D());
    g.save();g.lineTo(L+WD+30,base+GAP*.5);g.lineTo(L-30,base+GAP*.5);g.closePath();g.fillStyle='#0b0d12';g.fill();g.restore();
    g.beginPath();g.moveTo(L-30,base);
    for(let j=0;j<NB;j++){let v=yr.v[j];if(act)v=v*(1-liveA.v)+Math.pow(live[j],1.4)*liveA.v*.9;g.lineTo(L+j/(NB-1)*WD,base-v*shape(j)*AMP*breath)}
    g.lineTo(L+WD+30,base);
    g.lineWidth=act?1.8:hov?1.6:1.15;g.strokeStyle=act?'#e6b450':hov?'#ffffff':(yr.r.length?'rgba(236,232,220,.82)':'rgba(236,232,220,.22)');
    if(act){g.save();g.shadowColor='#e6b450';g.shadowBlur=12;g.stroke();g.restore()}else g.stroke();
    g.font=`${act||hov?12:11}px "IBM Plex Mono",monospace`;g.textBaseline='middle';
    g.fillStyle=act?'#e6b450':hov?'#ece8dc':'#6f747f';g.textAlign='right';g.fillText(String(yr.y),L-40,base);
  }
  requestAnimationFrame(frame);
}
function rowAt(y){const i=Math.round((y-T0)/GAP);return i>=0&&i<Y.length&&Math.abs(y-(T0+i*GAP))<GAP*.9?i:-1}
cv.addEventListener('pointermove',ev=>{const i=rowAt(ev.clientY);if(i!==hoverY){hoverY=i;if(playY<0)caption(i)}});
cv.addEventListener('pointerleave',()=>{hoverY=-1;if(playY<0)caption(-1)});
cv.addEventListener('click',ev=>{const i=rowAt(ev.clientY);if(i>=0)play(i)});
requestAnimationFrame(frame);
</script>
</body></html>
