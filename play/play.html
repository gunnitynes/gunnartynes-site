<!doctype html>
<html lang="en">
<head>
  <meta name="description" content="A playground made of múm songs: take them apart, put them back wrong, add yourself to the band.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>window.PG_STATIC = true;</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Playground</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/play.css">
</head>
<body>
  <header class="hud">
    <a class="btn ghost round" href="/" title="Back to the map">←</a>
    <div class="songinfo">
      <div class="title" id="song-title">…</div>
      <div class="pos mono"><span id="pos-bar">1</span><span class="faint">.</span><span id="pos-beat">1</span> <span class="section-chip" id="pos-section"></span></div>
    </div>
    <div class="transport">
      <button class="btn round" id="t-rew" title="Back to the start (Home)">⏮</button>
      <button class="btn round hot" id="t-play" title="Play / stop (Space)">▶</button>
      <button class="btn round" id="t-tape" title="Tape stop">⏏</button>
      <button class="btn rec" id="t-rec" title="Record a take (R) — audio and every move you make"><span class="dot"></span><span id="rec-label">REC</span></button>
    </div>
    <canvas id="hud-scope" width="240" height="44"></canvas>
    <div class="lvl" id="lvl" title="Your level — click for achievements"><div class="ring" id="lvl-ring">1</div><div><b id="lvl-name">wanderer</b><br><small id="lvl-xp">0 xp</small></div></div>
  </header>

  <nav class="worlds" id="worlds"></nav>
  <main id="stage"></main>

  <aside id="weather" class="drawer"></aside>
  <button class="btn weather-toggle" id="weather-toggle" title="Weather (W)">☁︎ Weather</button>

  <div id="replay-banner" hidden></div>

  <div id="splash">
    <div class="splash-inner">
      <div class="tiny dim" id="splash-band"></div>
      <h1 id="splash-title">…</h1>
      <p class="dim" id="splash-blurb"></p>
      <div class="loadbar"><i id="splash-bar"></i></div>
      <div class="tiny faint" id="splash-status">waking the musicians</div>
      <button class="btn hot big" id="splash-go" disabled>Enter the playground</button>
      <p class="faint keys">space play · r record · w weather · 1–4 / q–v pads</p>
    </div>
  </div>

  <dialog id="take-dialog"></dialog>
  <dialog id="trophy-dialog"></dialog>
  <div id="toasts"></div>

  <script type="module" src="js/play.js"></script>
</body>
</html>
