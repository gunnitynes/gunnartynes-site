<!doctype html>
<html lang="en">
<head>
  <meta name="description" content="A playground made of múm songs: take them apart, put them back wrong, add yourself to the band.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>window.PG_STATIC = true;</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hub.css">
</head>
<body>
  <canvas id="sky"></canvas>
  <header class="top">
    <div class="brand" id="band">…</div>
    <div class="lvl" id="lvl"><div class="ring" id="lvl-ring">1</div><div><b id="lvl-name">wanderer</b><br><small id="lvl-xp">0 xp</small></div></div>
  </header>
  <section class="hero">
    <div class="tiny dim">a playground</div>
    <h1 id="tagline">…</h1>
    <p class="dim lede">Pick a song. Every musician is a separate recording you can move, loop, chop, breed and re-weather — and then you can add yourself to the band.</p>
  </section>
  <section class="islands" id="songs"></section>
  <section class="gallery-wrap">
    <div class="gallery-head">
      <h2>Takes from other people</h2>
      <div class="tabs"><button class="btn small on" data-sort="new">newest</button><button class="btn small" data-sort="top">most loved</button></div>
    </div>
    <div class="gallery" id="gallery"></div>
  </section>
  <footer class="faint tiny">made by the band · the stems are ours, the remixes are yours</footer>
  <div id="toasts"></div>
  <script type="module" src="js/hub.js"></script>
</body>
</html>
