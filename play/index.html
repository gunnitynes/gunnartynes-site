<!doctype html>
<html lang="en">
<head>
  <meta name="description" content="A musical playground: take songs apart, put them back wrong, add yourself to the band.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>window.PG_STATIC = true;</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground · Gunnar Tynes</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#11141b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>addEventListener('pointerdown',function f(e){if(e.pointerType!=='touch'||/iP(hone|od|ad)/.test(navigator.userAgent)||document.fullscreenElement||!document.documentElement.requestFullscreen)return;removeEventListener('pointerdown',f,true);document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(function(){})},true)</script>
  <link rel="stylesheet" href="css/start.css">
</head>
<body>
  <header><a href="/">gunnar tynes</a></header>
  <main>
    <section class="hero" aria-label="Musical playground">
      <div class="intro">
        <h1>Musical playground</h1>
        <p class="lede">Each light is an instrument in the song. Touch a few.</p>
        <div id="songs" class="songs" role="group" aria-label="Songs"></div>
        <div class="now"><em id="s-title">…</em><small id="s-meta"></small></div>
        <a class="cta" id="cta" href="play.html">Experiment with song <span aria-hidden="true">→</span></a>
      </div>
      <div class="stage" id="stage">
        <canvas id="sky" aria-hidden="true"></canvas>
        <div id="lights"></div>
        <div class="core" id="core"><span id="hint" aria-live="polite">Touch a light</span></div>
        <div class="moments" id="moments" role="group" aria-label="Moment of the song"></div>
      </div>
    </section>
    <section class="inside" aria-label="What is inside">
      <h2>Then take it apart</h2>
      <div class="tiles" id="tiles"></div>
    </section>
    <a class="bar" id="bar" href="play.html"><span><em id="b-title"></em></span><b>Experiment with song →</b></a>
  </main>
  <noscript><p style="padding:20px">The playground needs JavaScript.</p></noscript>
  <script type="module" src="js/start.js"></script>
</body>
</html>
