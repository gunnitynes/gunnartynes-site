<!doctype html>
<html lang="en">
<head>
  <meta name="description" content="A musical playground: take songs apart, put them back wrong, add yourself to the band.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>window.PG_STATIC = true;</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground · Gunnar Tynes</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#11141b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>addEventListener('pointerdown',function f(e){if(e.pointerType!=='touch'||/iP(hone|od|ad)/.test(navigator.userAgent)||document.fullscreenElement||!document.documentElement.requestFullscreen)return;removeEventListener('pointerdown',f,true);document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(function(){})},true)</script>
  <style>
    :root{--ground:#11141b;--rule:#ffffff1c;--paper:#ece8dc;--dim:#a3a6ad;--p:#e6b450;--serif:"Newsreader",Georgia,serif;--sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
    *{box-sizing:border-box}html{background:var(--ground)}
    body{margin:0;min-height:100svh;background:var(--ground);color:var(--paper);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
    header{padding:calc(14px + env(safe-area-inset-top,0px)) 20px}header a{font:400 20px var(--serif);color:var(--paper);text-decoration:none}
    main{width:min(860px,100%);margin:0 auto;padding:clamp(30px,9vh,100px) 20px 80px}
    h1{margin:0;font:italic 400 clamp(42px,6vw,72px)/1 var(--serif);color:#fff}
    ol{list-style:none;margin:40px 0 0;padding:0;border-top:1px solid var(--rule)}
    li a{display:flex;align-items:center;gap:16px;padding:20px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
    li em{flex:1;font:italic 400 30px/1.1 var(--serif)}li a:hover em{color:var(--p)}li small{display:block;font:12px var(--mono);color:var(--dim)}
    li b{font:600 11.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:12px 18px;border-radius:24px;background:var(--p);color:#11141b;white-space:nowrap}
  </style>
</head>
<body>
  <header><a href="/">gunnar tynes</a></header>
  <main hidden><h1>Musical playground</h1><ol id="songs"></ol></main>
  <noscript><p style="padding:20px">The playground needs JavaScript.</p></noscript>
  <script type="module">
    // One song: straight in. More than one: choose.
    import { api, h } from './js/lib/util.js';
    const phone = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600, page = phone ? 'phone.html' : 'play.html';
    const songs = await api.get('/api/songs');
    if (songs.length === 1) location.replace(`${page}?song=${songs[0].id}`);
    else {
      document.querySelector('#songs').append(...songs.map((s) => h('li', {}, h('a', { href: `${page}?song=${s.id}` }, h('em', {}, s.title, h('small', {}, `${s.artist} · ${s.stems} stems`)), h('b', {}, 'Experiment with song →')))));
      document.querySelector('main').hidden = false;
    }
  </script>
</body>
</html>
