<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugins Admin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07070f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/site.css">
<style>
  body { background: var(--bg); }
  .band .btn { height: 30px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px;
    border-radius: 6px; border: 1px solid var(--rule2); background: var(--s2); cursor: pointer; white-space: nowrap;
    font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--t1);
  }
  .btn:hover { border-color: rgba(255,255,255,.3); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #031a16; }
  .btn.primary:disabled { background: var(--s3); border-color: var(--rule2); color: var(--t3); cursor: default; }
  .btn.danger { color: #ff7a8a; }
  .btn.danger:hover { border-color: #ff7a8a; }
  .btn.small { height: 26px; padding: 0 9px; font-size: 10px; }

  .login { max-width: 560px; margin: 8vh auto; padding: 0 var(--gutter); }
  .login h1 { font-weight: 500; font-size: 34px; margin: 10px 0 12px; }
  .login p, .login li { color: var(--t2); font-size: 15px; }
  .login ol { padding-left: 20px; }
  .login li { margin: 6px 0; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field .hint { font-size: 12.5px; color: var(--t3); }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0 14px; }
  input[type=text], input[type=password], input[type=url], textarea, select {
    width: 100%; background: var(--s2); border: 1px solid var(--rule2); border-radius: 6px; color: var(--t1);
    font: 13.5px/1.5 var(--mono); padding: 8px 10px; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--t2); font-size: 14px; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; }

  .shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 46px); }
  @media (max-width: 820px) { .shell { grid-template-columns: 1fr; } .side { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--rule); } }
  .side { border-right: 1px solid var(--rule); background: var(--s1); overflow: auto; position: sticky; top: 46px; height: calc(100vh - 46px); }
  @media (max-width: 820px) { .side { position: static; height: auto; } }
  .side .top { padding: 14px; display: flex; gap: 8px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--s1); z-index: 1; }
  .side ol { list-style: none; margin: 0; padding: 6px; }
  .side li {
    display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent; user-select: none;
  }
  .side li:hover { background: var(--s2); }
  .side li.sel { background: var(--s3); border-color: rgba(0,196,168,.4); }
  .side li.drop { border-top: 2px solid var(--accent); }
  .side li img, .side li .ph { width: 52px; height: 32px; border-radius: 3px; object-fit: cover; object-position: top left; background: var(--s3); flex: none; }
  .side li .nm { font: 600 13px/1.2 var(--sans); letter-spacing: .05em; }
  .side li .st { font: 10px/1.3 var(--mono); color: var(--t3); letter-spacing: .08em; text-transform: uppercase; }
  .side li .grip { margin-left: auto; color: var(--t3); cursor: grab; font-size: 14px; padding: 0 2px; }
  .side li.hid .nm { color: var(--t3); text-decoration: line-through; }
  .side li .dirty { width: 6px; height: 6px; border-radius: 50%; background: var(--ice); flex: none; }

  .main { padding: 26px var(--gutter) 120px; min-width: 0; }
  .main h2 { font-weight: 500; font-size: 26px; margin: 4px 0 22px; letter-spacing: .02em; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
  @media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }
  .preview { background: var(--s1); border: 1px solid var(--rule); border-radius: 8px; padding: 18px 20px; max-height: 70vh; overflow: auto; }
  .preview .prose li { grid-template-columns: minmax(0, 10em) minmax(0, 1fr); }

  .imgs { display: flex; flex-wrap: wrap; gap: 10px; }
  .imgs .im { position: relative; width: 170px; }
  .imgs .im img { width: 170px; aspect-ratio: 16/10; object-fit: cover; object-position: top left; border-radius: 6px; border: 1px solid var(--rule2); }
  .imgs .im .acts { display: flex; gap: 4px; margin-top: 5px; }
  .imgs .im .new { position: absolute; top: 6px; left: 6px; font: 9px var(--mono); background: var(--ice); color: #041026; padding: 2px 5px; border-radius: 3px; letter-spacing: .1em; }
  .dropzone {
    width: 170px; aspect-ratio: 16/10; border: 1px dashed var(--rule2); border-radius: 6px; display: flex; align-items: center; justify-content: center;
    text-align: center; color: var(--t3); font: 11px/1.4 var(--mono); cursor: pointer; padding: 8px;
  }
  .dropzone.over, .dropzone:hover { border-color: var(--accent); color: var(--accent); }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 12px var(--gutter);
    background: rgba(11,11,24,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--rule); }
  .bar .msg { flex: 1; font: 12px/1.4 var(--mono); color: var(--t2); min-width: 0; }
  .bar .msg.err { color: #ff7a8a; }
  .bar .msg.ok { color: var(--accent); }
  .bar input { max-width: 360px; }
  @media (max-width: 700px) { .bar { flex-wrap: wrap; } .bar input { max-width: none; } }
</style>
</head>
<body>
<header class="band">
  <span class="dot" aria-hidden="true"></span>
  <a class="mark" href="../">Plugins</a>
  <span class="label">Admin</span>
  <span class="spacer"></span>
  <a class="btn small" href="../../admin/">Releases</a>
  <a class="btn small" href="../../admin/concerts.html">Concerts</a>
  <a class="btn small" href="../" target="_blank">View site ↗</a>
  <button class="btn small" id="logout" hidden>Sign out</button>
</header>
<div id="root"></div>

<script src="../js/md.js"></script>
<script>
(() => {
  const root = document.getElementById('root');
  const esc = window.escapeHtml;
  const LS = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
               del: k => { try { localStorage.removeItem(k); } catch {} } };

  // The site lives in the DSP/ folder of the main site's repo (served at gunnartynes.com/DSP/).
  // Same repo and the same access key as the main site admin (stored as 'gt.key' on gunnartynes.com).
  const cfg = { owner: 'gunnitynes', repo: 'gunnartynes-site', dir: 'DSP/', branch: 'main', token: LS.get('gt.key') || '' };
  ['pa.owner', 'pa.repo', 'pa.dir', 'pa.branch', 'pa.token'].forEach(LS.del);

  let data = null;        // working copy {site, plugins}
  let original = '';      // JSON as loaded, for change detection
  let fileSha = '';       // blob sha of data/plugins.json when loaded
  let sel = null;         // selected plugin id, or '__site'
  const pending = {};     // path -> {blob, url} new image files to upload
  const dirtyIds = new Set();

  // ---------------- GitHub API ----------------
  async function gh(path, opts = {}) {
    const r = await fetch('https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + path, {
      ...opts,
      headers: { Authorization: 'Bearer ' + cfg.token, Accept: opts.accept || 'application/vnd.github+json',
                 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
    });
    if (!r.ok) {
      let m = r.status + ' ' + r.statusText;
      try { m = (await r.json()).message || m; } catch {}
      throw new Error(m + ' (' + path.split('?')[0] + ')');
    }
    return opts.raw ? r.text() : r.json();
  }
  const b64 = buf => { let s = ''; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  const utf8b64 = str => b64(new TextEncoder().encode(str));

  function friendly(e) {
    const m = String(e && e.message || e);
    if (/^401|Bad credentials/i.test(m)) return 'GitHub didn\'t accept that key. Check that you copied all of it.';
    if (/^40[34]|Not Found|Resource not accessible/i.test(m)) return 'The key works, but it can\'t reach the gunnartynes-site repository. Give it access to that repository with Contents: Read and write.';
    return m;
  }
  async function load() {
    const meta = await gh('/contents/' + cfg.dir + 'data/plugins.json?ref=' + cfg.branch);
    fileSha = meta.sha;
    const txt = await gh('/contents/' + cfg.dir + 'data/plugins.json?ref=' + cfg.branch, { accept: 'application/vnd.github.raw+json', raw: true });
    data = JSON.parse(txt);
    original = JSON.stringify(data);
  }

  // One atomic commit: plugins.json + any new images, minus any removed images.
  async function publish(message) {
    const ref = await gh('/git/ref/heads/' + cfg.branch);
    const head = ref.object.sha;
    const meta = await gh('/contents/' + cfg.dir + 'data/plugins.json?ref=' + head);
    if (meta.sha !== fileSha) throw new Error('The plugin list changed on GitHub since you opened this page (another device or browser?). Reload to get the latest, then redo your edit.');
    const commit = await gh('/git/commits/' + head);
    const used = new Set(data.plugins.flatMap(p => p.images.flatMap(i => [i.src, i.thumb])));
    const tree = [];
    for (const [path, f] of Object.entries(pending)) {
      if (!used.has(path)) continue;
      const blob = await gh('/git/blobs', { method: 'POST', body: JSON.stringify({ content: b64(await f.blob.arrayBuffer()), encoding: 'base64' }) });
      tree.push({ path: cfg.dir + path, mode: '100644', type: 'blob', sha: blob.sha });
    }
    const before = JSON.parse(original);
    for (const path of new Set(before.plugins.flatMap(p => p.images.flatMap(i => [i.src, i.thumb])))) {
      if (path && !used.has(path) && path.startsWith('images/')) tree.push({ path: cfg.dir + path, mode: '100644', type: 'blob', sha: null });
    }
    const json = JSON.stringify(data, null, 1) + '\n';
    const jb = await gh('/git/blobs', { method: 'POST', body: JSON.stringify({ content: utf8b64(json), encoding: 'base64' }) });
    tree.push({ path: cfg.dir + 'data/plugins.json', mode: '100644', type: 'blob', sha: jb.sha });
    const t = await gh('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: commit.tree.sha, tree }) });
    const c = await gh('/git/commits', { method: 'POST', body: JSON.stringify({ message, tree: t.sha, parents: [head] }) });
    await gh('/git/refs/heads/' + cfg.branch, { method: 'PATCH', body: JSON.stringify({ sha: c.sha }) });
    fileSha = jb.sha;
    original = JSON.stringify(data);
    for (const k in pending) delete pending[k];
    dirtyIds.clear();
    LS.del('pa.draft');
  }

  // ---------------- images ----------------
  async function toImage(file, maxW, q) {
    const bmp = await createImageBitmap(file);
    const w = Math.min(maxW, bmp.width), h = Math.round(bmp.height * w / bmp.width);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(bmp, 0, 0, w, h);
    let blob = await new Promise(r => c.toBlob(r, 'image/webp', q));
    if (!blob || blob.type !== 'image/webp') blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    return blob;
  }
  async function addImages(p, files) {
    for (const f of files) {
      if (!f.type.startsWith('image/')) continue;
      say('Processing ' + f.name + '…');
      const full = await toImage(f, 2000, 0.82), thumb = await toImage(f, 900, 0.78);
      const ext = full.type === 'image/webp' ? 'webp' : 'jpg';
      const stamp = Date.now().toString(36);
      const src = `images/${p.id}-${stamp}.${ext}`, th = `images/${p.id}-${stamp}-thumb.${ext}`;
      pending[src] = { blob: full, url: URL.createObjectURL(full) };
      pending[th] = { blob: thumb, url: URL.createObjectURL(thumb) };
      p.images.push({ src, thumb: th });
    }
    touch(p); renderEditor(); say('Image added. Publish to put it online.');
  }
  const imgUrl = path => pending[path] ? pending[path].url : '../' + path;

  // ---------------- UI ----------------
  function say(msg, cls = '') { const m = document.getElementById('msg'); if (m) { m.textContent = msg; m.className = 'msg ' + cls; } }
  function changed() { return JSON.stringify(data) !== original; }
  function touch(p) {
    if (p) dirtyIds.add(p.id);
    LS.set('pa.draft', JSON.stringify({ base: fileSha, data }));
    const b = document.getElementById('pub'); if (b) b.disabled = !changed();
    renderList();
  }
  const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'plugin';

  function renderLogin(err) {
    document.getElementById('logout').hidden = true;
    root.innerHTML = `<div class="login fade">
      <div class="label">Plugins · Admin</div>
      <h1>Sign in</h1>
      <p>Use the same access key as the main site admin. If you are already signed in there on this device, this page signs you in by itself.</p>
      <p><a href="../../admin/">Open the main admin</a> to sign in there instead, or paste the key here.</p>
      <div class="field"><label class="label" for="tok">Access key</label><input id="tok" type="password" autocomplete="off" spellcheck="false"></div>
      <p style="margin-top:14px"><button class="btn primary" id="go">Sign in</button></p>
      <p class="mono" style="color:#ff7a8a;font-size:13px">${err ? esc(err) : ''}</p>
    </div>`;
    const go = async () => {
      cfg.token = document.getElementById('tok').value.trim();
      if (!cfg.token) return renderLogin('Paste the access key first.');
      try { await load(); LS.set('gt.key', cfg.token); start(); }
      catch (e) { cfg.token = ''; renderLogin(friendly(e)); }
    };
    document.getElementById('go').onclick = go;
    document.getElementById('tok').onkeydown = e => { if (e.key === 'Enter') go(); };
  }

  function start() {
    document.getElementById('logout').hidden = false;
    // Offer to restore unpublished edits from last time.
    try {
      const d = JSON.parse(LS.get('pa.draft') || 'null');
      if (d && d.base === fileSha && JSON.stringify(d.data) !== original &&
          confirm('You have unpublished edits from last time on this device. Restore them?\n(New images from that session are not kept.)')) {
        const known = new Set(JSON.parse(original).plugins.flatMap(p => p.images.map(i => i.src)));
        d.data.plugins.forEach(p => p.images = p.images.filter(i => known.has(i.src)));
        data = d.data;
      } else LS.del('pa.draft');
    } catch {}
    root.innerHTML = `<div class="shell">
        <nav class="side"><div class="top"><button class="btn small" id="add">+ New plugin</button><button class="btn small" id="siteBtn">Site text</button></div><ol id="list"></ol></nav>
        <section class="main" id="main"></section>
      </div>
      <div class="bar"><span class="msg" id="msg"></span>
        <input type="text" id="cmsg" placeholder="What changed? (optional)">
        <button class="btn primary" id="pub" disabled>Publish</button></div>`;
    document.getElementById('add').onclick = () => {
      const name = prompt('Name of the new plugin?');
      if (!name) return;
      let id = slug(name), n = 2;
      while (data.plugins.some(p => p.id === id)) id = slug(name) + '-' + n++;
      const p = { id, name: name.toUpperCase(), subtitle: '', kind: 'Effect', tags: [], tagline: '', status: 'In development',
                  version: '', formats: 'AU · VST3', hidden: true, images: [], video: '', links: [], body: '' };
      data.plugins.unshift(p); sel = id; touch(p); renderEditor();
      say('New plugins start hidden. Untick “Hidden” when it is ready to show.');
    };
    document.getElementById('siteBtn').onclick = () => { sel = '__site'; renderList(); renderEditor(); };
    document.getElementById('pub').onclick = async () => {
      const b = document.getElementById('pub'); b.disabled = true;
      const names = [...dirtyIds].map(id => (data.plugins.find(p => p.id === id) || {}).name).filter(Boolean);
      const message = document.getElementById('cmsg').value.trim() || ('Update ' + (names.length ? names.slice(0, 4).join(', ') + (names.length > 4 ? '…' : '') : 'plugins'));
      try {
        say('Publishing…'); await publish(message);
        document.getElementById('cmsg').value = '';
        say('Published. The site updates in about a minute.', 'ok'); renderList(); renderEditor();
      } catch (e) { say(e.message, 'err'); b.disabled = !changed(); }
    };
    sel = sel || (data.plugins[0] || {}).id;
    renderList(); renderEditor();
    document.getElementById('pub').disabled = !changed();
    say(changed() ? 'Restored unpublished edits.' : 'Loaded ' + data.plugins.length + ' plugins from GitHub.');
  }

  let dragFrom = -1;
  function renderList() {
    const ol = document.getElementById('list'); if (!ol) return;
    ol.innerHTML = data.plugins.map((p, i) => `<li draggable="true" data-i="${i}" class="${p.id === sel ? 'sel' : ''} ${p.hidden ? 'hid' : ''}">
      ${p.images[0] ? `<img src="${esc(imgUrl(p.images[0].thumb || p.images[0].src))}" alt="" loading="lazy">` : '<span class="ph"></span>'}
      <span><div class="nm">${esc(p.name)}</div><div class="st">${esc(p.hidden ? 'hidden' : (p.status || ''))}</div></span>
      ${dirtyIds.has(p.id) ? '<span class="dirty" title="Unpublished changes"></span>' : ''}
      <span class="grip" title="Drag to reorder">⋮⋮</span></li>`).join('');
    ol.querySelectorAll('li').forEach(li => {
      const i = +li.dataset.i;
      li.onclick = () => { sel = data.plugins[i].id; renderList(); renderEditor(); };
      li.ondragstart = e => { dragFrom = i; e.dataTransfer.effectAllowed = 'move'; };
      li.ondragover = e => { e.preventDefault(); li.classList.add('drop'); };
      li.ondragleave = () => li.classList.remove('drop');
      li.ondrop = e => {
        e.preventDefault(); li.classList.remove('drop');
        if (dragFrom < 0 || dragFrom === i) return;
        const [m] = data.plugins.splice(dragFrom, 1); data.plugins.splice(i, 0, m); dragFrom = -1;
        touch(); say('Order changed.');
      };
    });
  }

  function bind(obj, key, el, after) {
    el.addEventListener('input', () => {
      obj[key] = el.type === 'checkbox' ? el.checked : el.value;
      if (after) after();
      touch(obj.id ? obj : null);
    });
  }

  function renderEditor() {
    const main = document.getElementById('main'); if (!main) return;
    if (sel === '__site') {
      const s = data.site;
      main.innerHTML = `<div class="label">Site text</div><h2>Front page</h2>
        <div class="field"><label class="label">Site name (top left)</label><input type="text" data-k="title" value="${esc(s.title || '')}"></div>
        <div class="field"><label class="label">Footer</label><input type="text" data-k="footer" value="${esc(s.footer || '')}"></div>`;
      main.querySelectorAll('[data-k]').forEach(el => bind(s, el.dataset.k, el));
      return;
    }
    const p = data.plugins.find(x => x.id === sel);
    if (!p) { main.innerHTML = '<p class="empty">Pick a plugin on the left.</p>'; return; }
    main.innerHTML = `
      <div class="label">${esc(p.kind || '')} · <span class="mono">#/${esc(p.id)}</span></div>
      <h2>${esc(p.name)}</h2>
      <div class="row">
        <div class="field"><label class="label">Name</label><input type="text" data-k="name" value="${esc(p.name)}"></div>
        <div class="field"><label class="label">Subtitle</label><input type="text" data-k="subtitle" value="${esc(p.subtitle)}"></div>
      </div>
      <div class="field"><label class="label">One-line description (card + detail lede)</label><input type="text" data-k="tagline" value="${esc(p.tagline)}"></div>
      <div class="row">
        <div class="field"><label class="label">Type</label><select data-k="kind">${['Effect', 'Instrument', 'MIDI effect', 'Max for Live', 'Other'].map(k => `<option ${k === p.kind ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
        <div class="field"><label class="label">Status</label><input type="text" data-k="status" list="statuses" value="${esc(p.status || '')}">
          <datalist id="statuses"><option>In development</option><option>Beta</option><option>Released</option><option>Private</option></datalist></div>
        <div class="field"><label class="label">Version</label><input type="text" data-k="version" value="${esc(p.version || '')}" placeholder="e.g. 1.2"></div>
        <div class="field"><label class="label">Formats</label><input type="text" data-k="formats" value="${esc(p.formats || '')}"></div>
      </div>
      <div class="field"><label class="label">Tags (comma separated — become the filter buttons)</label><input type="text" id="tags" value="${esc(p.tags.join(', '))}"></div>
      <label class="check" style="margin-bottom:22px"><input type="checkbox" data-k="hidden" ${p.hidden ? 'checked' : ''}> Hidden (not shown on the site)</label>

      <div class="field"><span class="label">Screenshots — the first one is the card image</span>
        <div class="imgs" id="imgs">
          ${p.images.map((im, k) => `<div class="im"><img src="${esc(imgUrl(im.thumb || im.src))}" alt="">${pending[im.src] ? '<span class="new">NEW</span>' : ''}
            <div class="acts">
              <button class="btn small" data-mv="${k}" data-d="-1" ${k === 0 ? 'disabled' : ''}>←</button>
              <button class="btn small" data-mv="${k}" data-d="1" ${k === p.images.length - 1 ? 'disabled' : ''}>→</button>
              <button class="btn small danger" data-rm="${k}">Remove</button></div></div>`).join('')}
          <label class="dropzone" id="dz">Drop images here<br>or click to choose<input type="file" accept="image/*" multiple hidden id="file"></label>
        </div><span class="hint">Images are resized and converted to WebP in your browser before upload.</span></div>

      <div class="field"><label class="label">Video (YouTube, Vimeo or .mp4 link — optional)</label><input type="url" data-k="video" value="${esc(p.video || '')}"></div>
      <div class="field"><label class="label">Links — one per line: Label | https://…</label>
        <textarea rows="2" id="links" placeholder="Download | https://…">${esc((p.links || []).map(l => l.label + ' | ' + l.url).join('\n'))}</textarea></div>

      <div class="split">
        <div class="field"><label class="label">Description</label>
          <textarea rows="26" data-k="body">${esc(p.body || '')}</textarea>
          <span class="hint">### Heading · * **TERM**: explanation · **bold** · [link](https://…) · blank line = new paragraph</span></div>
        <div class="field"><span class="label">Preview</span><div class="preview prose" id="pv">${window.renderMarkdown(p.body)}</div></div>
      </div>
      <p style="margin-top:30px"><a class="btn small" href="../#/${esc(p.id)}" target="_blank">Open live page ↗</a>
        <button class="btn small danger" id="del">Delete plugin</button></p>`;
    main.querySelectorAll('[data-k]').forEach(el => bind(p, el.dataset.k, el, () => {
      if (el.dataset.k === 'body') document.getElementById('pv').innerHTML = window.renderMarkdown(p.body);
      if (el.dataset.k === 'name') main.querySelector('h2').textContent = p.name;
    }));
    const tags = document.getElementById('tags');
    tags.addEventListener('input', () => { p.tags = tags.value.split(',').map(s => s.trim()).filter(Boolean); touch(p); });
    const links = document.getElementById('links');
    links.addEventListener('input', () => {
      p.links = links.value.split('\n').map(l => l.split('|')).filter(a => a.length >= 2 && a[1].trim())
        .map(a => ({ label: a[0].trim(), url: a.slice(1).join('|').trim() }));
      touch(p);
    });
    main.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
      const k = +b.dataset.mv, d = +b.dataset.d; const [m] = p.images.splice(k, 1); p.images.splice(k + d, 0, m); touch(p); renderEditor();
    });
    main.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { p.images.splice(+b.dataset.rm, 1); touch(p); renderEditor(); });
    const dz = document.getElementById('dz'), file = document.getElementById('file');
    file.onchange = () => addImages(p, [...file.files]);
    dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave = () => dz.classList.remove('over');
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove('over'); addImages(p, [...e.dataTransfer.files]); };
    document.getElementById('del').onclick = () => {
      if (!confirm('Delete ' + p.name + ' and its screenshots from the site? (Takes effect when you Publish.)')) return;
      data.plugins = data.plugins.filter(x => x !== p); dirtyIds.delete(p.id);
      sel = (data.plugins[0] || {}).id; touch(); renderEditor(); say(p.name + ' removed. Publish to make it final.');
    };
  }

  document.getElementById('logout').onclick = () => {
    if (changed() && !confirm('You have unpublished edits. Sign out anyway? (They stay saved as a draft on this device.)')) return;
    LS.del('gt.key'); cfg.token = ''; renderLogin();
  };
  window.addEventListener('beforeunload', e => { if (data && changed()) { e.preventDefault(); e.returnValue = ''; } });

  if (cfg.token) load().then(start).catch(e => { cfg.token = ''; renderLogin(friendly(e)); }); else renderLogin();
})();
</script>
</body>
</html>
