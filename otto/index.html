<!doctype html>

<style>
  :root {
    --bg: #f4f2ee;
    --ink: #2a2826;
    --muted: #8b857d;
    --faint: #b9b3aa;
    --line: #dcd7cf;
    --hover: #ece9e3;
    --mark: #6b6860;
    --bad: #9a5a4c;
    --serif: "EB Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1918; --ink: #e8e4dd; --muted: #948e85; --faint: #6c675f;
      --line: #36332f; --hover: #22211f; --mark: #b5afa5; --bad: #c98b7c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 17px/1.5 var(--serif);
    display: flex; justify-content: center;
    padding: clamp(56px, 14vh, 140px) 20px 64px;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 560px; animation: fade 1.2s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  header { text-align: center; margin-bottom: 48px; }
  .kicker {
    font: 500 11px/1 var(--sans); letter-spacing: .28em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 18px; text-wrap: balance;
  }
  @media (max-width: 360px) { .kicker { letter-spacing: .16em; } }
  h1 { font-weight: 400; font-size: clamp(40px, 9vw, 56px); line-height: 1.05; margin: 0; letter-spacing: .01em; }
  .rule { width: 36px; height: 1px; background: var(--faint); margin: 30px auto 0; border: 0; }

  #drop {
    border: 1px solid var(--line);
    border-radius: 2px;
    min-height: 210px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; text-align: center; padding: 36px 24px;
    cursor: pointer; transition: background .4s, border-color .4s;
    user-select: none;
  }
  #drop:hover, #drop.over { background: var(--hover); border-color: var(--faint); }
  #drop:focus-visible { outline: 1px solid var(--mark); outline-offset: 4px; }
  #drop svg { width: 22px; height: 22px; color: var(--muted); margin-bottom: 14px; }
  #drop .big { font-size: 21px; font-style: italic; text-wrap: balance; }
  #drop .small { color: var(--muted); font-size: 16px; }

  #status { margin-top: 36px; display: none; }
  #status.on { display: block; }
  .summary { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  #headline { font-size: 19px; }
  .count { font: 12px/1 var(--sans); letter-spacing: .08em; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bar { height: 2px; background: var(--line); overflow: hidden; border-radius: 2px; }
  .bar > i { display: block; position: relative; height: 100%; width: 0; background: var(--mark); transition: width .35s linear; overflow: hidden; }
  .bar.run > i::after {
    content: ""; position: absolute; inset: 0; width: 40%;
    background: linear-gradient(90deg, transparent, var(--bg), transparent); opacity: .55;
    animation: sheen 2.4s ease-in-out infinite;
  }
  @keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

  ul { list-style: none; padding: 0; margin: 14px 0 0; max-height: 46vh; overflow: auto; position: relative; }
  li {
    display: flex; align-items: baseline; gap: 12px;
    padding: 9px 0; border-bottom: 1px solid var(--line);
    font: 13px/1.4 var(--sans);
  }
  li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  li .st { flex: none; color: var(--faint); font-size: 12px; }
  li.ok .name { color: var(--ink); }
  li.ok .st { color: var(--muted); }
  li.bad .st { color: var(--bad); }
  li.busy .st { color: var(--muted); animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }
  .note { color: var(--muted); font: 13px/1.5 var(--sans); margin: 12px 0 0; min-height: 1.5em; }
  input[type=file] { display: none; }
  .view { display: block; text-align: center; margin: 22px 0 0; color: var(--muted); font-style: italic; text-decoration: none; }
  .view:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  @media (prefers-reduced-motion: reduce) { main, li.busy .st, .bar.run > i::after { animation: none; } }

  /* Clearer, larger text (variation B): the name stays in the book face, other text in a plain face. */
  :root { --muted: #6f6a62; --faint: #a39d94; }
  @media (prefers-color-scheme: dark) { :root { --muted: #aaa49a; --faint: #7c766d; } }
  body { font-size: 19px; }
  .kicker { font-size: 13px; letter-spacing: .24em; }
  h1 { font-size: clamp(46px, 10vw, 66px); }
  :root { --box: #fbfaf8; }
  @media (prefers-color-scheme: dark) { :root { --box: #262523; } }
  #drop { background: var(--box); min-height: 230px; }
  #drop:hover, #drop.over { background: var(--box); border-color: var(--mark); }
  #drop svg { width: 26px; height: 26px; color: var(--muted); }
  #drop .big { font: 500 21px/1.35 var(--sans); }
  #drop .small { font: 16px/1.4 var(--sans); color: var(--muted); }
  .view { font: 16px/1.4 var(--sans); color: var(--ink); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; text-decoration-color: var(--faint); }
  #headline { font: 500 18px/1.3 var(--sans); }
  .count { font-size: 14px; }
  li { font-size: 15px; padding: 11px 0; }
  li .st { font-size: 14px; color: var(--muted); }
  li.ok .st { color: var(--muted); }
  .note { font-size: 15px; }
  .view { margin-top: 44px; }

  /* Dark for everyone, whatever the device is set to. */
  :root {
    color-scheme: dark;
    --bg: #1a1918; --ink: #e8e4dd; --muted: #aaa49a; --faint: #7c766d;
    --line: #36332f; --hover: #22211f; --mark: #b5afa5; --bad: #c98b7c; --box: #262523; --tile: #242220;
  }
  /* On computers everything is a little larger. */
  @media (min-width: 900px) and (hover: hover) { main { zoom: 1.15; } }
</style>
</head>
<body>
<main>
  <header>
    <p class="kicker">Myndir, myndbönd og tónlist tengd</p>
    <h1>Ottó Tynes</h1>
    <hr class="rule">
  </header>

  <div id="drop" tabindex="0" role="button" aria-label="Veldu myndir, myndbönd eða tónlist til að hlaða upp">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
    </svg>
    <div class="big">Dragðu hingað til að hlaða upp</div>
    <div class="small">eða smelltu til að velja</div>
  </div>

  <a class="view" href="safn/">Skoða hvað er komið</a>

  <input type="file" id="pickFiles" multiple accept="image/*,audio/*,video/*,.mp4,.mov,.m4v,.3gp,.avi,.mkv,.webm,.mts,.m2ts,.mp3,.m4a,.wav,.aif,.aiff,.flac,.ogg,.aac,.heic,.heif,.dng,.cr2,.cr3,.nef,.arw,.raf,.orf,.rw2,.tif,.tiff">

  <section id="status" aria-live="polite">
    <div class="summary"><span id="headline">Hleð upp…</span><span class="count" id="count"></span></div>
    <div class="bar" id="bar"><i></i></div>
    <p class="note" id="note"></p>
    <ul id="list"></ul>
  </section>
</main>

<script>
// The Apps Script web app URL (ends in /exec).
const API = "https://script.google.com/macros/s/AKfycbyTuR0xoFTD3sFmkqfRcNg34-znVrCOiyJQjUrx29rQlb9eYOLwv_k2klQUX8SOoQp1/exec";

const SINGLE = 2 * 1024 * 1024;         // small files go in one request through the otto script
const PIECE = 16 * 1024 * 1024;         // bigger ones go straight to Google Drive in pieces of this size
const MAX_BYTES = 5 * 1024 * 1024 * 1024;
const PARALLEL = 4;
const IMAGE_EXT = /\.(jpe?g|png|gif|webp|heic|heif|avif|bmp|tiff?|dng|cr2|cr3|nef|arw|raf|orf|rw2|mp3|m4a|wav|aiff?|flac|ogg|oga|opus|aac|mp4|mov|m4v|3gp|avi|mkv|webm|mts|m2ts)$/i;

const drop = document.getElementById('drop');
const pickFiles = document.getElementById('pickFiles');
const list = document.getElementById('list');
const bar = document.getElementById('bar');

const queue = [];
let total = 0, finished = 0, failed = 0, skipped = 0, running = 0;

// ---- progress -----------------------------------------------------------
// The browser can't report upload progress for this kind of request (asking for it
// would break the connection to Google), so progress is counted in bytes: files that
// are finished count fully, and files on their way are estimated from the speed
// measured on the files that already arrived. The bar never jumps backwards.
const ENC = 1.37;                 // base64 + JSON makes each file ~37% larger on the wire
let bytesTotal = 0, bytesDone = 0, shown = 0, startedAt = 0, ticker = 0;
let rate = 0;                     // bytes per second for one request, measured
let overhead = 2.5;               // seconds Google spends per file regardless of size
const inflight = new Set();

function expected(it) {
  const r = rate || 400 * 1024;   // first guess until a file has arrived
  return overhead + it.cur * ENC / r;
}
function learn(it) {
  const secs = (performance.now() - it.t0) / 1000;
  const obs = it.cur * ENC / Math.max(0.4, secs - overhead * 0.8);
  rate = rate ? rate * 0.6 + obs * 0.4 : obs;
}
function estimate() {
  let b = bytesDone;
  const now = performance.now();
  for (const it of inflight) {
    const t = (now - it.t0) / 1000;
    // Straight-to-Drive pieces report real progress; the others are estimated.
    b += it.live != null ? it.live : it.cur * 0.93 * (1 - Math.exp(-1.7 * t / expected(it)));
  }
  return bytesTotal ? Math.min(1, b / bytesTotal) : 0;
}
function tick() {
  const target = estimate();
  if (target > shown) shown = target;
  draw();
  if (finished >= total) { clearInterval(ticker); ticker = 0; }
}

// ---- choosing ---------------------------------------------------------
drop.addEventListener('click', () => pickFiles.click());
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickFiles.click(); } });

pickFiles.addEventListener('change', () => { add([...pickFiles.files].map(f => ({ file: f, path: '' }))); pickFiles.value = ''; });

// Drag anywhere on the page works, not only on the box.
let depth = 0;
addEventListener('dragenter', e => { e.preventDefault(); depth++; drop.classList.add('over'); });
addEventListener('dragleave', e => { if (--depth <= 0) { depth = 0; drop.classList.remove('over'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => {
  e.preventDefault(); depth = 0; drop.classList.remove('over');
  const items = [...(e.dataTransfer.items || [])];
  // Entries must be taken synchronously, before any await.
  const entries = items.map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length) {
    const found = [];
    for (const entry of entries) await walk(entry, '', found);
    add(found);
  } else {
    add([...e.dataTransfer.files].map(f => ({ file: f, path: '' })));
  }
});

async function walk(entry, dir, out) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej)).catch(() => null);
    if (file) out.push({ file, path: dir });
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    const sub = dir ? dir + '/' + entry.name : entry.name;
    // readEntries returns at most ~100 at a time; keep reading until empty.
    for (;;) {
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej)).catch(() => []);
      if (!batch.length) break;
      for (const child of batch) await walk(child, sub, out);
    }
  }
}

function dirOf(rel) { const i = rel.lastIndexOf('/'); return i > 0 ? rel.slice(0, i) : ''; }
function isImage(f) { return (f.type && /^(image|audio|video)\//.test(f.type)) || IMAGE_EXT.test(f.name); }

// ---- queue ------------------------------------------------------------
function add(items) {
  for (const it of items) {
    if (it.file.name.startsWith('.') || !isImage(it.file)) { skipped++; continue; }
    const li = document.createElement('li');
    li.innerHTML = '<span class="name"></span><span class="st">Í biðröð</span>';
    li.querySelector('.name').textContent = (it.path ? it.path + '/' : '') + it.file.name;
    list.append(li);
    it.li = li;
    if (it.file.size > MAX_BYTES) { mark(it, 'bad', 'Of stór (yfir 5 GB)'); total++; finished++; failed++; continue; }
    queue.push(it); total++; bytesTotal += it.file.size;
  }
  if (!ticker && queue.length) { startedAt = performance.now(); ticker = setInterval(tick, 250); }
  shown = Math.min(shown, estimate());   // more files were added, so the share already sent is smaller
  document.getElementById('status').classList.add('on');
  update();
  pump();
}

function pump() {
  while (running < PARALLEL && queue.length) {
    const it = queue.shift();
    running++;
    it.t0 = performance.now(); it.sent = 0; it.cur = Math.min(it.file.size, it.file.size > SINGLE ? PIECE : SINGLE);
    inflight.add(it);
    send(it).finally(() => {
      inflight.delete(it); bytesDone += it.file.size - it.sent;
      running--; finished++; tick(); update(); pump();
    });
  }
}

async function send(it) {
  mark(it, 'busy', 'Hleð upp');
  if (it.file.size > SINGLE) return sendPieces(it);
  const data = await base64(it.file);
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const r = await fetch(API, {
        method: 'POST',
        body: JSON.stringify({ name: it.file.name, type: it.file.type, path: it.path, data })
      });
      const j = await r.json();
      if (j.ok) { learn(it); mark(it, 'ok', 'Komin'); return; }
      throw new Error(j.error || 'failed');
    } catch (err) {
      if (attempt === 3) { failed++; mark(it, 'bad', 'Mistókst'); return; }
      await new Promise(r => setTimeout(r, 1500 * attempt));
    }
  }
}

const post = body => fetch(API, { method: 'POST', body: JSON.stringify(body) }).then(r => r.json());

async function retry(fn, tries = 4) {
  for (let attempt = 1; ; attempt++) {
    try { const j = await fn(); if (j.ok) return j; throw new Error(j.error || 'failed'); }
    catch (err) { if (attempt >= tries || /not a photo|bad size|expired/.test(err.message)) throw err; await new Promise(r => setTimeout(r, 2000 * attempt)); }
  }
}

// Bigger files (videos, large photos and songs) go in pieces. The otto script opens the upload;
// the page then sends each piece straight to Google Drive, which is many times faster than
// passing the bytes through the script. If Drive refuses that, the pieces go through the script.
async function sendPieces(it) {
  const f = it.file, size = f.size;
  const pct = n => mark(it, 'busy', `Hleð upp ${Math.floor(n / size * 100)}%`);
  try {
    const head = await base64(f.slice(0, 512));
    const s = await retry(() => post({ op: 'start', name: f.name, type: f.type, path: it.path, size, head, origin: location.origin }));
    let direct = !!s.url, misses = 0, offset = 0, shared = false;
    while (offset < size) {
      const end = Math.min(size, offset + PIECE);
      it.cur = end - offset; it.t0 = performance.now();
      let next = null, done = false;
      if (direct) {
        it.live = 0;
        const r = await putPiece(s.url, f.slice(offset, end), offset, size, n => { it.live = n; });
        it.live = null;
        if (r.status === 200 || r.status === 201) { done = true; next = size; }
        else if (r.status === 308) next = r.range ? Number(r.range.split('-')[1]) + 1 : 0;
        else if (++misses >= 3 && offset === 0) direct = false;   // never got through: use the script
      } else {
        try {
          const data = await base64(f.slice(offset, end));
          const j = await retry(() => post({ op: 'piece', key: s.key, offset, data }), 3);
          done = !!j.done; next = done ? size : j.next; shared = done;
        } catch (err) { if (/expired/.test(err.message)) throw err; }
      }
      if (next === null) {                                  // a piece failed: ask Drive what it has
        await new Promise(r => setTimeout(r, 1500));
        const j = await retry(() => post({ op: 'status', key: s.key }));
        done = !!j.done; next = done ? size : j.next; shared = done;
        if (next <= offset && ++misses > 8) throw new Error('stuck');
      }
      if (next > offset) { learn(it); bytesDone += next - offset; it.sent += next - offset; offset = next; }
      if (done) break;
      pct(offset);
    }
    // Drive has the whole file; the script shares it for the gallery (unless it already did).
    if (!shared) await retry(() => post({ op: 'status', key: s.key }));
    mark(it, 'ok', 'Komin');
  } catch (err) {
    failed++; mark(it, 'bad', 'Mistókst');
  }
}

function putPiece(url, blob, offset, size, onProgress) {
  return new Promise(resolve => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.setRequestHeader('Content-Range', `bytes ${offset}-${offset + blob.size - 1}/${size}`);
    x.upload.onprogress = e => onProgress(e.loaded);
    x.onload = () => resolve({ status: x.status, range: x.getResponseHeader('Range') });
    x.onerror = x.ontimeout = () => resolve({ status: 0 });
    x.timeout = 10 * 60 * 1000;
    x.send(blob);
  });
}

function base64(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(',')[1] || '');
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}

function mark(it, cls, text) {
  it.li.className = cls; it.li.querySelector('.st').textContent = text;
  // Keep the files that are on their way in view, with the finished ones just above them.
  if (cls === 'busy') {
    const first = list.querySelector('li.busy');
    if (first) list.scrollTo({ top: Math.max(0, first.offsetTop - list.offsetTop - 2 * first.offsetHeight), behavior: 'smooth' });
  }
}

function minutes(n) { return n % 10 === 1 && n % 100 !== 11 ? 'mínúta' : 'mínútur'; }

function remaining() {
  // Overall speed so far; only once something has arrived and a few seconds have passed.
  const secs = (performance.now() - startedAt) / 1000;
  if (finished - failed < 1 || secs < 4 || shown <= 0) return '';
  const left = secs * (1 - shown) / shown;
  if (left < 8) return '';
  if (left < 50) return 'Innan við mínúta eftir.';
  const m = Math.round(left / 60);
  return `Um það bil ${m} ${minutes(m)} eftir.`;
}

function draw() {
  const done = finished >= total && total > 0;
  const p = done ? 1 : shown;
  bar.firstElementChild.style.width = (p * 100).toFixed(2) + '%';
  bar.classList.toggle('run', !done && total > 0);
  document.getElementById('count').textContent =
    !total ? '' : done ? `${finished - failed} af ${total} komnar` : `${finished - failed} af ${total} · ${Math.floor(p * 100)}%`;
  const notes = [];
  if (skipped) notes.push(`${skipped} ${skipped % 10 === 1 && skipped % 100 !== 11 ? 'skrá' : 'skrám'} sleppt (hvorki myndir, myndbönd né tónlist).`);
  if (!done && total) { const r = remaining(); if (r) notes.push(r); notes.push('Ekki loka síðunni fyrr en allt er komið.'); }
  document.getElementById('note').textContent = notes.join(' ');
}

function update() {
  const done = finished >= total && total > 0;
  draw();
  document.getElementById('headline').textContent =
    !total ? 'Engar myndir, myndbönd eða tónlist fundust' :
    !done ? 'Hleð upp…' :
    failed ? `Búið — ekki tókst að hlaða upp ${failed}` : 'Móttekið, takk fyrir!';
}

addEventListener('beforeunload', e => { if (finished < total) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
