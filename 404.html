<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gunnar Tynes</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--ground:#11141b;--paper:#ece8dc;--dim:#a3a6ad;--rule:#ffffff1a;--serif:"Newsreader",Georgia,serif;--sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ground);color:var(--paper);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:radial-gradient(120% 90% at 50% 30%,#181c27 0%,#11141b 62%)}
main{width:min(560px,100%)}
.groove{width:120px;height:120px;border-radius:50%;margin-bottom:34px;position:relative;background:repeating-radial-gradient(circle at 50% 50%,#0b0d12 0 1.4px,#1d212c 1.6px 2.6px);box-shadow:0 0 0 1px #ffffff1f;animation:spin 9s linear infinite}
.groove::after{content:"";position:absolute;inset:38%;border-radius:50%;background:#e6b450}
.groove::before{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--ground);z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.groove{animation:none}}
.n{font:13px var(--mono);letter-spacing:.18em;color:var(--dim)}
h1{font:italic 400 clamp(34px,7vw,48px)/1.08 var(--serif);margin:10px 0 12px}
p{color:#cfcbc0;margin:0 0 30px}
nav{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
nav a{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--rule);color:var(--paper);text-decoration:none;font:italic 400 24px var(--serif)}
nav a small{font:13px var(--sans);font-style:normal;color:var(--dim)}
nav a:hover small{color:var(--paper)}
nav a.live small::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#e6b450;margin-right:8px;vertical-align:1px}
</style></head><body>
<main>
  <div class="groove" aria-hidden="true"></div>
  <div class="n">404</div>
  <h1>This groove is empty.</h1>
  <p>The page you were looking for isn't here. Perhaps one of these:</p>
  <nav>
    <a href="/?start">Start page <small>gunnartynes.com</small></a>
    <a href="/?view=timeline">Timeline <small>All recorded projects</small></a>
    <a href="/?view=record">Record <small>Play the catalogue like a record</small></a>
    <a class="live" href="/live/">Live <small>The concerts on a map</small></a>
  </nav>
</main>
</body></html>
